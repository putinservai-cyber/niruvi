name: Build and Release


on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 3.1.0)'
        required: false
        type: string


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: write


jobs:
  test:
    name: Test before build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pyqt6 libqt6widgets6 \
            squashfs-tools librsvg2-bin


      - name: Install Python dependencies
        run: pip install -e ".[dev]"


      - name: Run tests
        run: python -m pytest tests/ -v --tb=short


  build:
    name: Build AppImage
    needs: test
    # Fixed: allow both tag pushes AND manual workflow_dispatch
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pyqt6 libqt6widgets6 libfuse2 \
            squashfs-tools librsvg2-bin


      - name: Install Python build dependencies
        run: |
          pip install setuptools wheel
          pip install -e ".[dev]"


      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            sed -i "s/__version__ = .*/__version__ = \"${VERSION}\"/" niruvi/_version.py
          else
            VERSION="${REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"


      - name: Build AppImage
        run: |
          chmod +x asset/appimagetool-x86_64.AppImage
          bash build-appimage.sh


      - name: Verify AppImage exists
        run: |
          ls -lh Niruvi-x86_64.AppImage
          file Niruvi-x86_64.AppImage


      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Niruvi-x86_64.AppImage
          path: Niruvi-x86_64.AppImage
          retention-days: 7


      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          name: Niruvi v${{ steps.version.outputs.VERSION }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: Niruvi-x86_64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
