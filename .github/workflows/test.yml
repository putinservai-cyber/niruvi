name: Test


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]


    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip


      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pyqt6 libqt6widgets6 \
            squashfs-tools librsvg2-bin


      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"


      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --junitxml=junit-${{ matrix.python-version }}.xml


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml


      - name: Verify all modules import
        run: |
          python -c "
          import pkgutil, importlib, sys
          import niruvi
          failures = []
          for _, modname, ispkg in pkgutil.walk_packages(niruvi.__path__, prefix='niruvi.'):
              try:
                  importlib.import_module(modname)
              except Exception as e:
                  failures.append(f'{modname}: {e}')
          if failures:
              print('FAILED IMPORTS:')
              for f in failures:
                  print(f'  {f}')
              sys.exit(1)
          print('All module imports OK')
          "
