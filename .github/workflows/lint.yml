name: Lint


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  ruff:
    name: Ruff check & format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install ruff
        run: pip install ruff


      - name: Ruff check
        run: ruff check niruvi/ tests/


      - name: Ruff format check
        run: ruff format --check niruvi/ tests/


  mypy:
    name: Mypy type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt6


      - name: Install mypy and project deps
        run: |
          pip install mypy
          pip install -e ".[dev]"


      - name: Run mypy
        run: mypy niruvi/ --ignore-missing-imports
